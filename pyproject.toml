[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "charlie-alpha"
version = "0.2.0"
description = "Reproducible Apple Silicon pipeline for the Charlie alpha trilingual math and coding model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Chih-Kai Wang" }]
dependencies = [
  "datasets==5.0.1",
  "huggingface-hub[hf-xet]==1.28.0",
  "lingua-language-detector==2.2.0",
  "math-verify==0.9.0",
  "mlx==0.32.1",
  "mlx-lm[train]==0.31.3",
  "opencc-python-reimplemented==0.1.7",
  "orjson==3.12.0",
  "psutil==7.2.2",
  "pyyaml>=6.0.2,<7",
  "rich==15.0.0",
  "safetensors>=0.6.2,<1",
  "transformers==5.15.1",
  "typer==0.27.1",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
eval = ["evalplus==0.3.1"]
export = [
  "accelerate>=1.10,<2",
  "cmake>=4,<5",
  "ninja>=1.13,<2",
  "peft==0.20.0",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[project.scripts]
charlie-alpha = "charlie_alpha.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/charlie_alpha"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
default-groups = ["dev"]
